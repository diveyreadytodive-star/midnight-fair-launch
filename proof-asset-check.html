<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090b0d" />
    <title>Fair Launch · Proof asset check</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #090b0d; color: #f4f6f7; }
      body { margin: 0; min-height: 100vh; }
      header { display: flex; justify-content: space-between; align-items: center; padding: 24px clamp(20px, 5vw, 72px); border-bottom: 1px solid #252b30; }
      a { color: #8be5d2; text-decoration: none; }
      button { cursor: pointer; font: inherit; }
      .locale { background: transparent; border: 1px solid #46535a; border-radius: 999px; color: #f4f6f7; padding: 8px 14px; }
      main { max-width: 640px; margin: clamp(48px, 12vh, 120px) auto; padding: 0 24px; }
      h1 { font-size: clamp(28px, 5vw, 42px); line-height: 1.12; margin: 0 0 18px; }
      p { color: #a9b4b8; line-height: 1.65; }
      .run { border: 0; border-radius: 14px; background: #8be5d2; color: #09201d; font-weight: 700; padding: 14px 24px; margin: 18px 0; }
      .run:disabled { opacity: .55; cursor: progress; }
      #status { min-height: 4em; border: 1px solid #2b3538; border-radius: 16px; background: #12171a; padding: 18px; white-space: pre-wrap; overflow-wrap: anywhere; }
    </style>
    <script type="module" src="./proof-asset-check.js?v=2"></script>
  </head>
  <body>
    <header><a id="backLink" href="./fair-launch.html#/explore">← Explore</a><button class="locale" id="localeToggle" type="button">EN</button></header>
    <main>
      <h1 id="title">브라우저 증명 파일 검사</h1>
      <p id="description">Midnight Preprod 테스트 계약의 발행·입찰 회로 파일이 이 사이트에서 읽히고 배포된 소스와 일치하는지 확인합니다. 약 25MB를 다운로드합니다.</p>
      <button class="run" id="runCheck" type="button">파일 검사 시작</button>
      <p id="status" role="status" aria-live="polite">이 검사는 지갑 연결, 증명 생성, 서명 또는 거래를 수행하지 않습니다.</p>
    </main>
  </body>
</html>
